test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# No access_key_id / secret_access_key: the aws-sdk-s3 gem falls back to the
# default credential provider chain, which on ECS resolves to the task role
# (see infrastructure IAM module) via the container credentials endpoint.
# This satisfies "S3 via IAM role, not AccessKey/SecretKey".
amazon:
  service: S3
  bucket: <%= ENV['S3_BUCKET_NAME'] %>
  region: <%= ENV['S3_REGION_NAME'] %>
